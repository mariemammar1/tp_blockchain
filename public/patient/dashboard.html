<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace Patient</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">🧑 Espace Patient</div>
  <div class="user-info">
    <span id="patientNameTop"></span>
    <button class="btn btn-secondary btn-small" onclick="logout()">Déconnexion</button>
  </div>
</header>

<div class="container">
  <div class="card">
    <h2>👤 Mon profil</h2>
    <p id="profileDetails" style="color:#64748b; margin-bottom: 16px;">Chargement...</p>

    <form id="profileForm" onsubmit="updateProfile(event)">
      <div class="grid-2">
        <div>
          <label for="patientName">Nom et Prénom</label>
          <input type="text" id="patientName" required autocomplete="name">
        </div>
        <div>
          <label for="patientEmail">Adresse Email</label>
          <input type="email" id="patientEmail" required autocomplete="email">
        </div>
      </div>
      <div>
        <label for="patientBirthDate">Date de naissance</label>
        <input type="date" id="patientBirthDate">
      </div>

      <div style="margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--border);">
        <h4 style="margin: 0 0 4px; color: var(--text);">Sécurité & Mot de passe</h4>
        <p style="font-size: 13px; color: var(--muted); margin: 0 0 12px;">Laisser vide pour ne pas le modifier</p>

        <div>
          <label for="currentPassword">Mot de passe actuel <span style="font-weight: normal; color: var(--muted);">(obligatoire seulement si vous changez de mot de passe)</span></label>
          <input type="password" id="currentPassword" placeholder="••••••••" autocomplete="current-password">
        </div>

        <div class="grid-2" style="margin-top: 8px;">
          <div>
            <label for="newPassword">Nouveau mot de passe</label>
            <input type="password" id="newPassword" placeholder="••••••••" autocomplete="new-password">
          </div>
          <div>
            <label for="confirmPassword">Confirmer le nouveau mot de passe</label>
            <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password">
          </div>
        </div>
      </div>

      <div id="profileMsg"></div>
      <button type="submit" class="btn" style="width: auto; margin-top: 16px;">Enregistrer les modifications</button>
    </form>
  </div>

  <div class="card">
    <h3>📋 Mon dossier médical</h3>
    <div id="dossierContainer"></div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>

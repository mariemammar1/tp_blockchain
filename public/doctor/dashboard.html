<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace Médecin</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">🩺 Espace Médecin</div>
  <div class="user-info">
    <span id="doctorName"></span>
    <button class="btn btn-secondary btn-small" onclick="logout()">Déconnexion</button>
  </div>
</header>

<div class="container">
  <div class="card">
    <h2>👨‍⚕️ Mon profil</h2>
    <p id="doctorProfileDetails" style="color:#64748b; margin-bottom: 16px;">Chargement...</p>

    <form id="doctorProfileForm" onsubmit="updateDoctorProfile(event)">
      <div class="grid-2">
        <div>
          <label for="doctorNameInput">Nom et Prénom</label>
          <input type="text" id="doctorNameInput" required autocomplete="name">
        </div>
        <div>
          <label for="doctorEmailInput">Adresse Email</label>
          <input type="email" id="doctorEmailInput" required autocomplete="email">
        </div>
      </div>
      <div>
        <label for="doctorSpecialtyInput">Spécialité <span style="font-weight: normal; color: var(--muted);">(non modifiable)</span></label>
        <input type="text" id="doctorSpecialtyInput" readonly disabled style="background-color: #f1f5f9; cursor: not-allowed;">
      </div>

      <div style="margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--border);">
        <h4 style="margin: 0 0 4px; color: var(--text);">Sécurité & Mot de passe</h4>
        <p style="font-size: 13px; color: var(--muted); margin: 0 0 12px;">Laisser vide pour ne pas le modifier</p>

        <div>
          <label for="doctorCurrentPassword">Mot de passe actuel <span style="font-weight: normal; color: var(--muted);">(obligatoire seulement si vous changez de mot de passe)</span></label>
          <input type="password" id="doctorCurrentPassword" placeholder="••••••••" autocomplete="current-password">
        </div>

        <div class="grid-2" style="margin-top: 8px;">
          <div>
            <label for="doctorNewPassword">Nouveau mot de passe</label>
            <input type="password" id="doctorNewPassword" placeholder="••••••••" autocomplete="new-password">
          </div>
          <div>
            <label for="doctorConfirmPassword">Confirmer le nouveau mot de passe</label>
            <input type="password" id="doctorConfirmPassword" placeholder="••••••••" autocomplete="new-password">
          </div>
        </div>
      </div>

      <div id="doctorProfileMsg"></div>
      <button type="submit" class="btn" style="width: auto; margin-top: 16px;">Enregistrer les modifications</button>
    </form>
  </div>

  <div class="card">
    <h2>Mes patients</h2>
    <table id="patientsTable">
      <thead>
        <tr>
          <th>Nom</th>
          <th>Email</th>
          <th>Date de naissance</th>
          <th>Genre</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="patientsBody"></tbody>
    </table>
    <div class="empty-state hidden" id="emptyState">Aucun patient enregistré pour le moment.</div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
